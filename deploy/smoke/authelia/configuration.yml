# Standalone Authelia for the smoke stack (ADR 0002, unit A5). It carries everything except the two CBS snippets,
# which deploy/smoke/run.sh merges in from deploy/authelia/ after replacing example.com with the smoke domain:
#   authelia --config configuration.yml --config cbs-session-cookies.yml --config cbs-access-control.yml
# Secrets arrive as AUTHELIA_* environment variables generated by run.sh. If the owner picks a host of its own for
# CBS (ADR 0002, option D), this becomes the production configuration with only values changed.
theme: auto

server:
  address: tcp://0.0.0.0:9091/

log:
  level: info

# The smoke stack runs offline.
ntp:
  disable_startup_check: true

authentication_backend:
  password_reset:
    disable: true
  file:
    path: /users/users_database.yml
    watch: true
    password:
      algorithm: argon2

totp:
  issuer: cbs-smoke

storage:
  local:
    path: /state/db.sqlite3

notifier:
  filesystem:
    filename: /state/notification.txt

regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 5m
