name: client-billing

# Each environment has its own Postgres (ADR 0001, unit D11). The database sits on an internal network that only its
# own app and migrator join, so the public proxy, the other environment and the internet cannot reach it, and it
# publishes no port. Each app also joins its own edge network. Barstock's host-wide Caddy joins those two networks
# and imports caddy/cbs.shared-host.caddy; this stack never binds ports 80 or 443. deploy/smoke/compose.yml runs its
# own standalone Caddy and Authelia for local verification.

x-app: &app
  build:
    context: ..
    target: runner
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 20s

x-db: &db
  image: postgres:16-alpine
  restart: unless-stopped
  environment:
    POSTGRES_USER: postgres
    POSTGRES_DB: cbs
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d cbs"]
    interval: 5s
    timeout: 3s
    retries: 30

# A one-off container: deploy-remote.sh runs it with `run --rm`. The profile keeps `up` from starting it.
x-migrator: &migrator
  build:
    context: ..
    target: migrator
  profiles: ["migrate"]
  restart: "no"

services:
  app-staging:
    <<: *app
    image: client-billing:staging
    env_file:
      - path: ../.env.staging
        required: false
    volumes:
      - staging_data:/data
    networks:
      - staging-edge
      - staging-db

  db-staging:
    <<: *db
    env_file:
      - path: ../.env.staging.db
        required: false
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    networks:
      - staging-db

  migrator-staging:
    <<: *migrator
    env_file:
      - path: ../.env.staging
        required: false
      - path: ../.env.staging.db
        required: false
    networks:
      - staging-db

  app-production:
    <<: *app
    image: client-billing:production
    env_file:
      - path: ../.env.production
        required: false
    volumes:
      - production_data:/data
    networks:
      - production-edge
      - production-db

  db-production:
    <<: *db
    env_file:
      - path: ../.env.production.db
        required: false
    volumes:
      - production_pgdata:/var/lib/postgresql/data
    networks:
      - production-db

  migrator-production:
    <<: *migrator
    env_file:
      - path: ../.env.production
        required: false
      - path: ../.env.production.db
        required: false
    networks:
      - production-db

networks:
  # One edge network per environment. The fixed names let Barstock's host-wide Caddy join both while staging stays
  # isolated from production (ADR 0002, decision 6).
  staging-edge:
    name: cbs-staging-edge
  production-edge:
    name: cbs-production-edge
  staging-db:
    internal: true
  production-db:
    internal: true

volumes:
  staging_data:
  production_data:
  staging_pgdata:
  production_pgdata:
