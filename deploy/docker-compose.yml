name: client-billing

x-app: &app
  build:
    context: ..
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 20s

services:
  app-staging:
    <<: *app
    image: client-billing:staging
    env_file:
      - path: ../.env.staging
        required: false
    volumes:
      - staging_data:/data

  app-production:
    <<: *app
    image: client-billing:production
    env_file:
      - path: ../.env.production
        required: false
    volumes:
      - production_data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - path: ./proxy.env
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  staging_data:
  production_data:
  caddy_data:
  caddy_config:
